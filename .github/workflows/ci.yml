name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install bcrypt python-jose[cryptography] pytest sqlalchemy pydantic-settings

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/test_auth.py -v
